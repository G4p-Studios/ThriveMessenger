[server]
port = 2005

[smtp]
code_expires = 5m

[bots]
; Bots are an experimental optional server module. No bot runtime is enabled by default.
names =
ollama_enabled = false
ollama_url = http://127.0.0.1:11434
ollama_model = llama3.2
ollama_timeout = 20
status_map = assistant-bot:online,helper-bot:online
purpose_map = assistant-bot:general app helper,helper-bot:service specialist
service_map = assistant-bot:chat contacts settings server manager file transfer admin tools,helper-bot:troubleshooting account login notifications updates

[modules]
; Comma-separated HTTPS JSON catalogs hosted by your Thrive server, GitHub, or Gitea.
catalog_urls =
; Optional comma-separated hostname allowlist for catalogs and archives.
allowed_hosts =
