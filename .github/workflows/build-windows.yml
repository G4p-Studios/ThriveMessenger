name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      build_label:
        description: "Optional label appended to artifact name"
        required: false
        default: ""
  push:
    branches:
      - main
      - "fix/**"
      - "release/**"
    paths:
      - "main.py"
      - "client.conf"
      - "sounds/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"
      - "pyproject.toml"
      - "thrive_messenger_installer.iss"
      - "vdata.yml"

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_LABEL: ${{ github.event.inputs.build_label || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-versionfile keyring plyer wxPython sounddevice

      - name: Build one-folder app
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -OutputDir "dist-windows"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc ".\thrive_messenger_installer.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_LABEL != '' && format('thrive-messenger-windows-portable-{0}', env.BUILD_LABEL) || 'thrive-messenger-windows-portable' }}
          path: dist-windows/thrive_messenger.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_LABEL != '' && format('thrive-messenger-windows-installer-{0}', env.BUILD_LABEL) || 'thrive-messenger-windows-installer' }}
          path: dist-windows/thrive_messenger_installer.exe
          if-no-files-found: error
